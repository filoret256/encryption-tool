<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encryption Tool</title>
    <style>
        /* ── Fonts (system stack, no external CDN) ── */
        :root {
            --mono: 'Cascadia Code', 'Cascadia Mono', 'Consolas', 'Menlo', 'Monaco',
                    'Liberation Mono', 'DejaVu Sans Mono', 'Courier New', monospace;
            --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue',
                    Arial, 'Liberation Sans', sans-serif;
        }

        /* ── Themes ── */
        :root,
        [data-theme="light"] {
            --bg:           #f4f4f1;
            --surface:      #ffffff;
            --surface-2:    #f0f0ec;
            --surface-3:    #fbfbfa;
            --surface-4:    #f8f8f6;
            --border:       #ddddd8;
            --border-hover: #bbbbb5;
            --border-focus: #888882;
            --text:         #1a1a17;
            --text-dim:     #555550;
            --text-muted:   #9a9a94;
            --ansible:      #c45200;
            --ansible-bg:   #fff5ef;
            --ansible-dim:  #e8a070;
            --helm:         #1d5fd4;
            --helm-bg:      #eff4ff;
            --helm-dim:     #7aaae8;
            --btn-primary-bg:   #1a1a17;
            --btn-primary-text: #ffffff;
            --btn-primary-hover:#333330;
            --toast-bg:     #1a1a17;
            --toast-text:   #ffffff;
            --toast-err-bg: #fef2f2;
            --toast-err-text:#b91c1c;
            --toast-err-border:#fca5a5;
        }

        [data-theme="dark"] {
            --bg:           #0e0e0c;
            --surface:      #161614;
            --surface-2:    #1e1e1b;
            --surface-3:    #131311;
            --surface-4:    #11110f;
            --border:       #2a2a26;
            --border-hover: #3a3a36;
            --border-focus: #5a5a52;
            --text:         #e8e8e2;
            --text-dim:     #888880;
            --text-muted:   #484840;
            --ansible:      #e8722a;
            --ansible-bg:   #1f1208;
            --ansible-dim:  #7a3810;
            --helm:         #4a90e2;
            --helm-bg:      #080e1a;
            --helm-dim:     #1e3a6a;
            --btn-primary-bg:   #e8e8e2;
            --btn-primary-text: #0e0e0c;
            --btn-primary-hover:#c8c8c2;
            --toast-bg:     #2a2a26;
            --toast-text:   #e8e8e2;
            --toast-err-bg: #2a0e0e;
            --toast-err-text:#f87171;
            --toast-err-border:#5a1a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;
            -ms-flex-direction: column;
            flex-direction: column;
            min-height: 100vh;
            -webkit-transition: background 0.2s, color 0.2s;
            transition: background 0.2s, color 0.2s;
        }

        /* ── Header ── */
        .header {
            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-align: stretch;
            -ms-flex-align: stretch;
            align-items: stretch;
            height: 44px;
            border-bottom: 1px solid var(--border);
            -ms-flex-negative: 0;
            flex-shrink: 0;
            background: var(--surface);
        }

        .header-logo {
            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-align: center;
            -ms-flex-align: center;
            align-items: center;
            padding: 0 20px 0 16px;
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.04em;
            border-right: 1px solid var(--border);
            white-space: nowrap;
            -ms-flex-negative: 0;
            flex-shrink: 0;
        }

        /* ── Tabs (left side of header) ── */
        .tabs {
            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-align: stretch;
            -ms-flex-align: stretch;
            align-items: stretch;
        }

        .tab {
            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-align: center;
            -ms-flex-align: center;
            align-items: center;
            gap: 8px;
            padding: 0 16px;
            height: 44px;
            border: none;
            background: none;
            cursor: pointer;
            position: relative;
            border-right: 1px solid var(--border);
            -webkit-transition: background 0.12s;
            transition: background 0.12s;
        }

        .tab-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--border-hover);
            -webkit-transition: background 0.12s;
            transition: background 0.12s;
            -ms-flex-negative: 0;
            flex-shrink: 0;
        }

        .tab-name {
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 400;
            color: var(--text-muted);
            -webkit-transition: color 0.12s;
            transition: color 0.12s;
            white-space: nowrap;
        }

        .tab:hover { background: var(--surface-2); }
        .tab:hover .tab-name { color: var(--text-dim); }
        .tab:hover .tab-dot { background: var(--border-focus); }

        .tab-ansible.active { background: var(--ansible-bg); }
        .tab-ansible.active .tab-dot { background: var(--ansible); }
        .tab-ansible.active .tab-name { color: var(--ansible); }
        .tab-ansible.active::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 2px;
            background: var(--ansible);
        }

        .tab-helm.active { background: var(--helm-bg); }
        .tab-helm.active .tab-dot { background: var(--helm); }
        .tab-helm.active .tab-name { color: var(--helm); }
        .tab-helm.active::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 2px;
            background: var(--helm);
        }

        /* ── Header right controls ── */
        .header-right {
            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-align: center;
            -ms-flex-align: center;
            align-items: center;
            margin-left: auto;
            padding: 0 16px;
            gap: 8px;
            border-left: 1px solid var(--border);
        }

        /* Theme toggle */
        .theme-toggle {
            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-align: center;
            -ms-flex-align: center;
            align-items: center;
            gap: 6px;
            background: none;
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            padding: 4px 10px;
            -webkit-transition: all 0.12s;
            transition: all 0.12s;
        }
        .theme-toggle:hover { border-color: var(--border-hover); background: var(--surface-2); }

        .theme-icon {
            font-size: 13px;
            line-height: 1;
        }

        .theme-label {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-muted);
        }

        /* ── Tab content ── */
        .tab-content {
            display: none;
            -webkit-box-flex: 1;
            -ms-flex: 1;
            flex: 1;
            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;
            -ms-flex-direction: column;
            flex-direction: column;
            overflow: hidden;
        }
        .tab-content.active {
            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;
        }

        /* ── Toolbar ── */
        .toolbar {
            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-align: center;
            -ms-flex-align: center;
            align-items: center;
            padding: 0 16px;
            height: 40px;
            border-bottom: 1px solid var(--border);
            -ms-flex-negative: 0;
            flex-shrink: 0;
            background: var(--surface);
            overflow-x: auto;
            overflow-y: hidden;
            /* hide scrollbar but keep scroll */
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .toolbar::-webkit-scrollbar { display: none; }

        .toolbar-sep {
            width: 1px;
            height: 18px;
            background: var(--border);
            margin: 0 10px;
            -ms-flex-negative: 0;
            flex-shrink: 0;
        }

        .t-label {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-muted);
            margin-right: 6px;
            white-space: nowrap;
            -ms-flex-negative: 0;
            flex-shrink: 0;
        }

        .pw-wrap {
            position: relative;
            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-align: center;
            -ms-flex-align: center;
            align-items: center;
            -ms-flex-negative: 0;
            flex-shrink: 0;
        }

        .t-input {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            font-family: var(--mono);
            font-size: 12px;
            padding: 4px 28px 4px 10px;
            outline: none;
            width: 200px;
            -webkit-transition: border-color 0.12s;
            transition: border-color 0.12s;
        }
        .t-input:focus { border-color: var(--border-focus); }
        .t-input::-webkit-input-placeholder { color: var(--text-muted); }
        .t-input:-ms-input-placeholder { color: var(--text-muted); }
        .t-input::placeholder { color: var(--text-muted); }

        .t-eye {
            position: absolute;
            right: 7px;
            top: 50%;
            -webkit-transform: translateY(-50%);
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 12px;
            padding: 0;
            line-height: 1;
            -webkit-transition: color 0.12s;
            transition: color 0.12s;
        }
        .t-eye:hover { color: var(--text-dim); }

        .t-btn {
            display: -webkit-inline-box;
            display: -ms-inline-flexbox;
            display: inline-flex;
            -webkit-box-align: center;
            -ms-flex-align: center;
            align-items: center;
            padding: 4px 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-family: var(--mono);
            font-size: 11px;
            cursor: pointer;
            background: transparent;
            color: var(--text-dim);
            -webkit-transition: background 0.1s, border-color 0.1s, color 0.1s;
            transition: background 0.1s, border-color 0.1s, color 0.1s;
            white-space: nowrap;
            margin-right: 5px;
            -ms-flex-negative: 0;
            flex-shrink: 0;
        }
        .t-btn:last-child { margin-right: 0; }
        .t-btn:hover { background: var(--surface-2); border-color: var(--border-hover); color: var(--text); }
        .t-btn:active { background: var(--border); }

        .t-btn-primary {
            background: var(--btn-primary-bg);
            color: var(--btn-primary-text);
            border-color: var(--btn-primary-bg);
            font-weight: 500;
        }
        .t-btn-primary:hover {
            background: var(--btn-primary-hover);
            border-color: var(--btn-primary-hover);
            color: var(--btn-primary-text);
        }

        .t-spacer {
            -webkit-box-flex: 1;
            -ms-flex: 1;
            flex: 1;
            min-width: 8px;
        }

        /* ── Editor ── */
        .editor-wrap {
            -webkit-box-flex: 1;
            -ms-flex: 1;
            flex: 1;
            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;
            overflow: hidden;
            min-height: 0;
        }

        textarea {
            -webkit-box-flex: 1;
            -ms-flex: 1;
            flex: 1;
            width: 100%;
            padding: 16px 20px;
            background: var(--bg);
            color: var(--text);
            border: none;
            outline: none;
            resize: none;
            font-family: var(--mono);
            font-size: 13px;
            line-height: 1.65;
            /* no word wrap — horizontal scroll for long lines */
            white-space: pre;
            overflow-wrap: normal;
            word-wrap: normal;
            overflow-x: auto;
            overflow-y: auto;
            -webkit-tab-size: 4;
            tab-size: 4;
            -webkit-transition: background 0.2s, color 0.2s;
            transition: background 0.2s, color 0.2s;
        }
        textarea::-webkit-input-placeholder { color: var(--text-muted); font-style: italic; }
        textarea:-ms-input-placeholder { color: var(--text-muted); font-style: italic; }
        textarea::placeholder { color: var(--text-muted); font-style: italic; }

        /* ── Status bar ── */
        .statusbar {
            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-align: center;
            -ms-flex-align: center;
            align-items: center;
            padding: 0 20px;
            height: 24px;
            border-top: 1px solid var(--border);
            background: var(--surface);
            -ms-flex-negative: 0;
            flex-shrink: 0;
        }

        .sb-item {
            font-family: var(--mono);
            font-size: 10px;
            color: var(--text-muted);
            margin-right: 18px;
            white-space: nowrap;
        }
        .sb-item b { color: var(--text-dim); font-weight: 400; }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 8px 14px;
            border-radius: 4px;
            font-family: var(--mono);
            font-size: 12px;
            z-index: 9999;
            opacity: 0;
            -webkit-transform: translateY(6px);
            transform: translateY(6px);
            -webkit-transition: opacity 0.15s, -webkit-transform 0.15s;
            transition: opacity 0.15s, transform 0.15s;
            pointer-events: none;
            border: 1px solid transparent;
        }
        .toast.show { opacity: 1; -webkit-transform: translateY(0); transform: translateY(0); }
        .toast-success { background: var(--toast-bg); color: var(--toast-text); }
        .toast-error { background: var(--toast-err-bg); color: var(--toast-err-text); border-color: var(--toast-err-border); }

        /* find/replace panel */
        .find-panel {
            display: none;
            -webkit-box-align: center;
            -ms-flex-align: center;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--surface-4);
            -ms-flex-negative: 0;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .find-panel.show { display: -webkit-box; display: -ms-flexbox; display: flex; }
        .find-input {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            font-family: var(--mono);
            font-size: 12px;
            padding: 4px 8px;
            outline: none;
            width: 180px;
            -webkit-transition: border-color 0.12s;
            transition: border-color 0.12s;
        }
        .find-input:focus { border-color: var(--border-focus); }
        .find-input::-webkit-input-placeholder { color: var(--text-muted); }
        .find-input:-ms-input-placeholder { color: var(--text-muted); }
        .find-input::placeholder { color: var(--text-muted); }
        .find-input.no-match { border-color: #e05252 !important; }
        .find-count {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-muted);
            min-width: 64px;
            white-space: nowrap;
        }
        .find-sep { width:1px; height:18px; background:var(--border); margin:0 4px; flex-shrink:0; }
        .find-close {
            margin-left: auto;
            background: none; border: none; cursor: pointer;
            color: var(--text-muted); font-size: 15px; padding: 2px 6px;
            border-radius: 4px; line-height: 1;
            -webkit-transition: color 0.12s, background 0.12s;
            transition: color 0.12s, background 0.12s;
        }
        .find-close:hover { color: var(--text); background: var(--surface-2); }
        .find-lbl { font-family:var(--mono); font-size:11px; color:var(--text-muted); white-space:nowrap; }

        /* ── Active toggle button ── */
        .t-btn.is-active {
            background: var(--surface-2);
            border-color: var(--border-focus);
            color: var(--text);
        }

        /* ── Secondary toolbar row (yaml + view options) ── */
        .toolbar-secondary {
            display: none;
            align-items: center;
            padding: 0 16px;
            height: 36px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            background: var(--surface-3);
            overflow-x: auto;
            overflow-y: hidden;
            -ms-overflow-style: none;
            scrollbar-width: none;
            gap: 0;
        }
        .toolbar-secondary::-webkit-scrollbar { display: none; }
        .toolbar-secondary.visible { display: flex; }

        .toolbar-secondary .t-btn {
            font-size: 11px;
            padding: 3px 9px;
            height: 26px;
        }
        .toolbar-secondary .toolbar-sep {
            height: 14px;
        }
        .toolbar-secondary .t-label {
            font-size: 10px;
            color: var(--text-muted);
            margin-right: 6px;
        }

        /* ── header-right toggle button ── */
        .theme-toggle.is-active {
            background: var(--surface-2);
            border-color: var(--border-focus);
        }
        .theme-toggle.is-active .theme-label { color: var(--text-dim); }

        /* ── YAML validate / beautify ── */
        .t-btn.yaml-ok {
            border-color: #4a9e6a;
            color: #4a9e6a;
        }
        .t-btn.yaml-ok:hover { background: rgba(74,158,106,0.08); border-color: #3a8e5a; }

        .t-btn.yaml-err {
            border-color: #e05252;
            color: #e05252;
        }
        .t-btn.yaml-err:hover { background: rgba(224,82,82,0.08); border-color: #c04040; }

        /* beautify disabled look */
        .t-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* tiny format badge shown after validate */
        .yaml-badge {
            display: inline-block;
            font-family: var(--mono);
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            margin-left: 2px;
            border: 1px solid transparent;
            transition: opacity 0.15s;
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .yaml-badge.show { opacity: 1; }
        .yaml-badge.ok  { background: rgba(74,158,106,0.12); border-color: #4a9e6a; color: #4a9e6a; }
        .yaml-badge.err { background: rgba(224,82,82,0.10);  border-color: #e05252; color: #e05252; }

        /* ══════════════════════════════════════════════════════
           EDITOR LAYOUT WITH LINE NUMBERS + WS OVERLAY
           
           .editor-wrap  (flex row, overflow:hidden)
             ├── .gutter   sticky left column, scrolls with textarea via JS transform
             └── .ed-body  flex:1, position:relative
                   ├── textarea   the ONE scroll container
                   └── .ws-over   absolute, full scrollHeight, moved via JS transform
           
           Key insight: gutter and overlay are NOT in a scroll container.
           They move via CSS transform applied synchronously in the
           'scroll' event handler — zero lag, zero flicker.
        ══════════════════════════════════════════════════════ */

        .editor-wrap {
            -webkit-box-flex: 1;
            -ms-flex: 1;
            flex: 1;
            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-orient: horizontal;
            -ms-flex-direction: row;
            flex-direction: row;
            overflow: hidden;
            min-height: 0;
        }

        /* Gutter — fixed width column, clips content, never scrolls itself */
        .gutter {
            -ms-flex-negative: 0;
            flex-shrink: 0;
            width: 0;
            overflow: hidden;
            background: var(--surface);
            border-right: 0 solid var(--border);
            font-family: var(--mono);
            font-size: 13px;
            line-height: 1.65;
            color: var(--text-muted);
            text-align: right;
            pointer-events: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            /* padding kept at 0 until visible so transition looks clean */
            -webkit-transition: background 0.2s, width 0.12s, padding 0.12s, border-width 0.12s;
            transition: background 0.2s, width 0.12s, padding 0.12s, border-width 0.12s;
        }
        .gutter.on {
            width: 52px;
            padding: 16px 8px 16px 0;
            border-right-width: 1px;
        }
        /* inner span scrolls via transform */
        .gutter-inner {
            display: block;
            white-space: pre;
            will-change: transform;
        }

        /* ed-body: fills remaining width, clips overlay overflow */
        .ed-body {
            -webkit-box-flex: 1;
            -ms-flex: 1;
            flex: 1;
            position: relative;
            overflow: hidden;   /* needed to contain absolutely positioned children */
            min-width: 0;
        }

        /* Override original textarea — it now lives inside .ed-body */
        .ed-body textarea {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%;
            height: 100%;
            padding: 16px 20px;
            background: var(--bg);
            color: var(--text);
            border: none;
            outline: none;
            resize: none;
            font-family: var(--mono);
            font-size: 13px;
            line-height: 1.65;
            white-space: pre;
            overflow-wrap: normal;
            word-wrap: normal;
            overflow-x: auto;
            overflow-y: auto;
            -webkit-tab-size: 4;
            tab-size: 4;
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
            -webkit-transition: background 0.2s, color 0.2s;
            transition: background 0.2s, color 0.2s;
            /* z-index above overlay so user can click/select */
            position: absolute;
            z-index: 1;
            background: transparent;
        }
        /* keep caret/selection visible on transparent textarea */
        .ed-body textarea { color: var(--text); }
        /* We draw bg on ed-body itself so overlay sits on top of bg */
        .ed-body { background: var(--bg); -webkit-transition: background 0.2s; transition: background 0.2s; }

        .ed-body textarea::-webkit-input-placeholder { color: var(--text-muted); font-style: italic; }
        .ed-body textarea:-ms-input-placeholder      { color: var(--text-muted); font-style: italic; }
        .ed-body textarea::placeholder               { color: var(--text-muted); font-style: italic; }

        /* wrap mode */
        .ed-body textarea.wrap-on {
            white-space: pre-wrap;
            overflow-wrap: break-word;
            word-wrap: break-word;
            overflow-x: hidden;
        }

        /* Whitespace overlay — sits BELOW caret layer (z-index:0),
           covers full scrollHeight so content is always visible.
           Moved by the same transform as gutter on scroll. */
        .ws-over {
            position: absolute;
            top: 0; left: 0;
            /* width and height set by JS to match scrollWidth/scrollHeight */
            pointer-events: none;
            overflow: visible;
            color: transparent;
            z-index: 0;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            display: none;
            will-change: transform;
            /* font/padding/white-space matched to textarea by JS */
        }
        .ws-over.on { display: block; }

        .ws-sp  { color: var(--text-muted); opacity: 0.5; }
        .ws-tab { color: #4a90e2;           opacity: 0.6; }
        .ws-cr  { color: #e05252;           opacity: 0.7; }
        .ws-lf  { color: #888;              opacity: 0.5; }

        /* Mirror — off-screen, used only for per-line height measurement */
        .ln-mirror {
            /* Inside .ed-body so it gets exact same layout width as textarea.
               Pushed far above viewport so it's invisible but still laid out. */
            position: absolute;
            top: -99999px;
            left: 0;
            right: 0;          /* inherits ed-body width = textarea width */
            visibility: hidden;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }
    </style>
</head>

    <script>
        // ── State ──
        var currentTab = 'ansible';
        var fileCallback = null;
        var isDark = false;

        // ── Theme ──
        function toggleTheme() {
            isDark = !isDark;
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            document.getElementById('theme-icon').textContent = isDark ? '☾' : '☀';
            document.getElementById('theme-label').textContent = isDark ? 'dark' : 'light';
            try { localStorage.setItem('enc-theme', isDark ? 'dark' : 'light'); } catch(e) {}
        }

        // restore saved theme
        try {
            var saved = localStorage.getItem('enc-theme');
            if (saved === 'dark') {
                isDark = true;
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('theme-icon').textContent = '☾';
                document.getElementById('theme-label').textContent = 'dark';
            }
        } catch(e) {}

        // ── Secondary toolbar toggle ──
        var _toolbar2Visible = false;

        function toggleSecondaryToolbar() {
            _toolbar2Visible = !_toolbar2Visible;
            _applyToolbar2();
            try { localStorage.setItem('enc-toolbar2', _toolbar2Visible ? '1' : '0'); } catch(e) {}
        }

        function _applyToolbar2() {
            var btn   = document.getElementById('toolbar-toggle-btn');
            var tabs  = ['ansible', 'helm'];
            for (var i = 0; i < tabs.length; i++) {
                var el = document.getElementById(tabs[i] + '-toolbar2');
                if (el) {
                    if (_toolbar2Visible) el.classList.add('visible');
                    else                 el.classList.remove('visible');
                }
            }
            if (btn) btn.classList[_toolbar2Visible ? 'add' : 'remove']('is-active');
        }

        // restore secondary toolbar preference
        try {
            if (localStorage.getItem('enc-toolbar2') === '1') {
                _toolbar2Visible = true;
                _applyToolbar2();
            }
        } catch(e) {}

        // ── Tabs ──
        function switchTab(tab) {
            currentTab = tab;
            var tabs = document.querySelectorAll('.tab');
            for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
            var contents = document.querySelectorAll('.tab-content');
            for (var i = 0; i < contents.length; i++) contents[i].classList.remove('active');
            document.querySelector('.tab-' + tab).classList.add('active');
            document.getElementById(tab + '-tab').classList.add('active');
            updateStats(tab);
            _applyToolbar2();
            _syncFindBtn();
        }

        // ── Toast ──
        var toastTimer = null;
        function showToast(msg, isError) {
            var toast = document.getElementById('toast');
            if (toastTimer) clearTimeout(toastTimer);
            toast.textContent = msg;
            toast.className = 'toast ' + (isError ? 'toast-error' : 'toast-success') + ' show';
            toastTimer = setTimeout(function() { toast.className = 'toast'; }, 2500);
        }

        // ── Password toggle ──
        function togglePassword(id) {
            var input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        // ── Stats ──
        function updateStats(tab) {
            var el = document.getElementById(tab + '-text');
            var val = el.value;
            var lines = val === '' ? 0 : val.split('\n').length;
            var chars = val.length;
            var bytes = 0;
            // byte count without TextEncoder (IE/old edge compat)
            try {
                bytes = new TextEncoder().encode(val).length;
            } catch(e) {
                bytes = unescape(encodeURIComponent(val)).length;
            }
            var sel = Math.abs(el.selectionEnd - el.selectionStart);
            document.getElementById(tab + '-lines').textContent = lines.toLocaleString();
            document.getElementById(tab + '-chars').textContent = chars.toLocaleString();
            document.getElementById(tab + '-bytes').textContent = bytes.toLocaleString();
            document.getElementById(tab + '-sel').textContent = sel.toLocaleString();
        }

        // ── API ──
        function apiCall(endpoint, data, cb) {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', endpoint, true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 0) { cb(null, 'network error'); return; }
                    try { cb(JSON.parse(xhr.responseText), null); }
                    catch(e) { cb(null, 'invalid response'); }
                }
            };
            xhr.onerror = function() { cb(null, 'network error'); };
            xhr.send(JSON.stringify(data));
        }

        function helmAction(action) {
            var text = document.getElementById('helm-text').value;
            var password = document.getElementById('helm-password').value;
            if (!text) return showToast('text required', true);
            if (!password) return showToast('password required', true);
            apiCall('/helm/' + action, { text: text, password: password }, function(data, err) {
                if (err) return showToast(err, true);
                if (data.error) return showToast(data.error, true);
                document.getElementById('helm-text').value = data.result;
                updateStats('helm');
                showToast(action === 'encrypt' ? 'encrypted' : 'decrypted');
            });
        }

        function ansibleAction(action) {
            var text = document.getElementById('ansible-text').value;
            var password = document.getElementById('ansible-password').value;
            if (!text) return showToast('text required', true);
            if (!password) return showToast('password required', true);
            apiCall('/ansible/' + action, { text: text, password: password }, function(data, err) {
                if (err) return showToast(err, true);
                if (data.error) return showToast(data.error, true);
                document.getElementById('ansible-text').value = data.result;
                updateStats('ansible');
                showToast(action === 'encrypt' ? 'encrypted' : 'decrypted');
            });
        }

        // ── YAML validate / beautify ──

        // Reset validate state when user edits the textarea
        // Hooked into existing onTaInput — we piggyback by wrapping it below
        var _yamlValid = { ansible: false, helm: false };

        function _yamlReset(tab) {
            _yamlValid[tab] = false;
            var badge    = document.getElementById(tab + '-yaml-badge');
            var yamlBtn  = document.getElementById(tab + '-yaml-btn');
            var beautBtn = document.getElementById(tab + '-beautify-btn');
            if (!badge) return;
            badge.className  = 'yaml-badge';
            badge.textContent = '';
            yamlBtn.className = yamlBtn.className.replace(/\byaml-ok\b|\byaml-err\b/g, '').trim();
            beautBtn.disabled = true;
        }

        function yamlValidate(tab) {
            var text = document.getElementById(tab + '-text').value;
            if (!text.trim()) return showToast('nothing to validate', true);

            var badge    = document.getElementById(tab + '-yaml-badge');
            var yamlBtn  = document.getElementById(tab + '-yaml-btn');
            var beautBtn = document.getElementById(tab + '-beautify-btn');

            apiCall('/validate', { text: text }, function(data, err) {
                if (err) return showToast(err, true);

                // strip old state classes
                yamlBtn.className = yamlBtn.className
                    .replace(/\byaml-ok\b|\byaml-err\b/g, '').trim();

                if (data.result && data.result.valid) {
                    _yamlValid[tab] = true;
                    yamlBtn.className  += ' yaml-ok';
                    badge.className     = 'yaml-badge ok show';
                    badge.textContent   = '✓ ' + (data.result.format || 'YAML');
                    beautBtn.disabled   = false;
                    showToast('valid ' + (data.result.format || 'YAML'));
                } else {
                    _yamlValid[tab] = false;
                    var errMsg = (data.result && data.result.error) ? data.result.error : (data.error || 'invalid');
                    yamlBtn.className  += ' yaml-err';
                    badge.className     = 'yaml-badge err show';
                    // show only first line of error — YAML errors can be long
                    badge.textContent   = '✗ ' + errMsg.split('\n')[0].substring(0, 60);
                    beautBtn.disabled   = true;
                    showToast('invalid YAML', true);
                }
            });
        }

        // ── YAML scalar quote normalization ──────────────────────────────
        // Rules (matching yaml.dump / PyYAML behaviour):
        //   no quotes  — plain scalars that round-trip as the same string
        //   single ''  — scalars that need quoting but have no special escapes
        //   double ""  — scalars with backslash, newline, or other C-escapes
        var _YAML_NEEDS_DOUBLE = /[\x00-\x08\x0b\x0c\x0e-\x1f\\]/;

        function _quoteScalar(s) {
            if (s === '') return "''";
            if (_YAML_NEEDS_DOUBLE.test(s)) {
                var esc = s.replace(/\\/g, '\\\\')
                           .replace(/"/g, '\\"')
                           .replace(/\n/g, '\\n')
                           .replace(/\r/g, '\\r')
                           .replace(/\t/g, '\\t');
                return '"' + esc + '"';
            }
            // Check if plain (no quotes) would round-trip correctly.
            // Heuristic matching PyYAML safe_load behaviour:
            var plain = _plainSafe(s);
            if (plain) return s;
            // Need quotes — prefer single; switch to double only if value
            // contains ' but not " (avoids ugly '' escaping)
            if (s.indexOf("'") !== -1 && s.indexOf('"') === -1) {
                return '"' + s.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
            }
            return "'" + s.replace(/'/g, "''") + "'";
        }

        function _plainSafe(s) {
            // Reject if YAML would parse it as non-string
            if (/^(?:true|false|yes|no|on|off|null|~|\.inf|[-+]?\.inf|\.nan)$/i.test(s)) return false;
            // Reject if it looks like an integer or float
            if (/^[-+]?(?:0x[0-9a-fA-F]+|0o[0-7]+|0b[01]+|[0-9]+)$/.test(s)) return false;
            if (/^[-+]?(?:[0-9][0-9_]*)?\.[0-9]*(?:[eE][-+][0-9]+)?$/.test(s)) return false;
            // Reject if leading/trailing whitespace
            if (s !== s.trim()) return false;
            // Reject if starts with a YAML indicator char
            if (/^[{}\[\],#&*!|>'":%@`?]/.test(s)) return false;
            // Reject if contains ': ' (mapping indicator) or ' #' (inline comment)
            if (s.indexOf(': ') !== -1 || s.indexOf(' #') !== -1) return false;
            // Reject if ends with ':'
            if (/:\s*$/.test(s)) return false;
            return true;
        }

        // ── Reindent YAML using indent-stack (preserves comments & key order) ──
        function _reindentYaml(lines, target) {
            // Stack entries: [rawCol, isListKeyOffset]
            // isListKeyOffset=true marks a virtual +2 entry pushed for "- key:" lines
            // so that their children indent correctly relative to the key (not the dash).
            var stack  = [[0, false]];
            var result = [];

            for (var i = 0; i < lines.length; i++) {
                var line     = lines[i];
                var stripped = line.trim();

                if (!stripped) { result.push({ level: -1, content: '' }); continue; }

                var rawN = line.length - line.replace(/^ */, '').length;

                if (stripped.charAt(0) === '#') {
                    var level = 0;
                    for (var j = 0; j < stack.length; j++) {
                        if (stack[j][0] <= rawN) level = j;
                    }
                    if (rawN > stack[stack.length - 1][0]) level = stack.length;
                    result.push({ level: level, content: stripped });
                    continue;
                }

                // Pop back to parent: remove entries whose rawCol > current rawN
                while (stack.length > 1 && rawN < stack[stack.length - 1][0]) stack.pop();
                // Also remove a dangling list-key-offset entry at same or shallower level
                while (stack.length > 1 && stack[stack.length - 1][1] &&
                       rawN <= stack[stack.length - 2][0] + 2) {
                    stack.pop();
                }

                var isListItem = /^- /.test(stripped) && stripped.indexOf(':') !== -1;

                if (rawN > stack[stack.length - 1][0]) {
                    // Going deeper
                    stack.push([rawN, false]);
                    if (isListItem) stack.push([rawN + 2, true]);
                } else if (isListItem) {
                    // Same-level list item: refresh the key-offset slot
                    if (stack[stack.length - 1][1]) stack.pop();
                    stack.push([rawN + 2, true]);
                }

                var level = stack.length - 1;
                if (isListItem) level = stack.length - 2; // render at dash level

                result.push({ level: level, content: stripped });
            }

            // render
            var out = [];
            for (var i = 0; i < result.length; i++) {
                var r = result[i];
                if (r.level === -1) { out.push(''); continue; }
                out.push(new Array(r.level * target + 1).join(' ') + r.content);
            }
            return out;
        }

        // ── Normalize quotes on a single YAML value string ───────────────────
        // Handles: key: value, key: 'value', key: "value"
        // Multiline (|, >) and flow sequences/mappings are left untouched.
        // Split  value-part + inline-comment, respecting quotes.
        // e.g. "'900000' # every 15 min" → ["'900000'", " # every 15 min"]
        function _splitValueComment(s) {
            var inSq = false, inDq = false;
            for (var i = 0; i < s.length; i++) {
                var c = s[i];
                if      (c === "'" && !inDq) inSq = !inSq;
                else if (c === '"' && !inSq) inDq = !inDq;
                else if (c === '#' && !inSq && !inDq && i > 0 && s[i-1] === ' ') {
                    return [s.slice(0, i).trimRight(), ' ' + s.slice(i)];
                }
            }
            return [s, ''];
        }

        // Normalize quotes on a single YAML scalar line.
        // inBlockScalar: true when the line is CONTENT inside a | or > block — skip.
        function _normalizeLineQuotes(line, inBlockScalar) {
            if (inBlockScalar) return line;

            // Match:  <indent><key><colon-space><value>
            var m = line.match(/^(\s*)([\w\-./\[\]"'@${}]+\s*:\s*)(.+)$/);
            if (!m) return line;

            var indent  = m[1];
            var keypart = m[2];
            var valpart = m[3].trim();

            // Skip block scalars, anchors, aliases, flow collections
            if (/^[|>&*!{\[]/.test(valpart)) return line;
            // Skip comment-only values
            if (valpart.charAt(0) === '#') return line;

            // ── Step 1: split off inline comment FIRST (quote-aware) ──
            var parts = _splitValueComment(valpart);
            var valueStr    = parts[0].trim();
            var inlineComment = parts[1];  // e.g. " # every 15 min" or ""

            // Skip if value still looks complex (flow collections, multi-word with colons)
            if (/[{\[]/.test(valueStr)) return line;

            // ── Step 2: strip existing quotes to get raw string ──
            var raw = valueStr;
            var hadQuote = false;

            if (raw.length >= 2) {
                var first = raw.charAt(0), last = raw.charAt(raw.length - 1);
                if (first === "'" && last === "'") {
                    hadQuote = true;
                    raw = raw.slice(1, -1).replace(/''/g, "'");
                } else if (first === '"' && last === '"') {
                    hadQuote = true;
                    raw = raw.slice(1, -1)
                             .replace(/\\n/g, '\n').replace(/\\r/g, '\r')
                             .replace(/\\t/g, '\t').replace(/\\"/g, '"')
                             .replace(/\\\\/g, '\\');
                }
            }

            // If unquoted, also try splitting comment again now (rare edge case)
            if (!hadQuote && inlineComment === '') {
                var p2 = _splitValueComment(raw);
                raw = p2[0].trim();
                inlineComment = p2[1];
            }

            // ── Step 3: re-quote using canonical rules ──
            var quoted = _quoteScalar(raw);
            return indent + keypart + quoted + inlineComment;
        }

        function yamlBeautify(tab) {
            if (!_yamlValid[tab]) return showToast('validate first', true);
            var el   = document.getElementById(tab + '-text');
            var text = el.value;
            if (!text.trim()) return;

            try {
                var TARGET = 2;
                // Normalize tab indentation first
                var lines = text.split('\n').map(function(line) {
                    return line.replace(/^\t+/, function(t) {
                        return new Array(t.length * 2 + 1).join(' ');
                    });
                });

                // Reindent using stack algorithm
                var reindented = _reindentYaml(lines, TARGET);

                // Normalize quotes on each line, skipping block scalar content.
                // Track whether we're inside a | or > block scalar:
                // a line ends a block scalar when we see a key at same/lower indent.
                var quoted = [];
                var blockScalarIndent = -1;  // indent level that started the block; -1 = not in block
                for (var bi = 0; bi < reindented.length; bi++) {
                    var bline = reindented[bi];
                    var bstripped = bline.trim();
                    var bindent = bline.length - bline.replace(/^ */, '').length;

                    if (blockScalarIndent >= 0) {
                        // We're inside a block scalar.
                        // Exit when we hit a non-empty line at indent <= block starter's indent.
                        if (bstripped && bindent <= blockScalarIndent) {
                            blockScalarIndent = -1;  // exit block scalar
                        }
                    }

                    var inBlock = blockScalarIndent >= 0;

                    if (!inBlock && /^[|>][|>\-+0-9]*\s*(#.*)?$/.test(bstripped.replace(/^[\w\-./\[\]"'@${}]+\s*:\s*/, ''))) {
                        // This line has a | or > block scalar indicator — next lines are content
                        // (only trigger if the value portion is the indicator, not the key itself)
                        var valAfterKey = bstripped.replace(/^[\w\-./\[\]"'@${}]+\s*:\s*/, '');
                        if (/^[|>]/.test(valAfterKey)) {
                            blockScalarIndent = bindent;
                        }
                    }

                    quoted.push(_normalizeLineQuotes(bline, inBlock));
                }

                // Cleanup: max 1 consecutive blank line, single trailing newline
                var final = [];
                var blankRun = 0;
                for (var i = 0; i < quoted.length; i++) {
                    if (quoted[i] === '') {
                        blankRun++;
                        if (blankRun <= 1) final.push('');
                    } else {
                        blankRun = 0;
                        final.push(quoted[i]);
                    }
                }
                while (final.length && final[0] === '') final.shift();
                while (final.length && final[final.length - 1] === '') final.pop();
                final.push('');

                el.value = final.join('\n');
                updateStats(tab);
                _schedule(tab);
                showToast('beautified');
            } catch(e) {
                showToast('beautify failed: ' + e.message, true);
            }
        }

        // ── Base64 ──
        function base64Encode(tab) {

        function base64EncodeUnix(tab) {

        // ── Paste: normalise leading tabs → spaces (YAML forbids tab indent) ──

                    e.preventDefault();
                    // replace only LEADING tabs per line with 2 spaces each

        // TAB key + auto-indent
        function handleEditorKey(e, tab) {
            var el = e.target;
            var key = e.key || '';
            var code = e.keyCode || 0;

            if (key === 'Tab' || code === 9) {
                e.preventDefault();
                var start = el.selectionStart;
                var end = el.selectionEnd;
                var val = el.value;
                if (start === end) {
                    el.value = val.substring(0, start) + '    ' + val.substring(end);
                    el.selectionStart = el.selectionEnd = start + 4;
                } else {
                    var lines = val.split('\n');
                    var lineStart = val.substring(0, start).split('\n').length - 1;
                    var lineEnd   = val.substring(0, end).split('\n').length - 1;
                    var delta = 0;
                    for (var i = lineStart; i <= lineEnd; i++) {
                        if (e.shiftKey) {
                            var stripped = lines[i].replace(/^    /, '');
                            delta -= lines[i].length - stripped.length;
                            lines[i] = stripped;
                        } else {
                            lines[i] = '    ' + lines[i];
                            delta += 4;
                        }
                    }
                    el.value = lines.join('\n');
                    el.selectionStart = start;
                    el.selectionEnd = end + delta;
                }
                updateStats(tab);
                return;
            }

            // Ctrl+] indent / Ctrl+[ unindent current line (regardless of selection)
            if ((e.ctrlKey || e.metaKey) && (key === ']' || code === 221 || key === '[' || code === 219)) {
                e.preventDefault();
                var indent = (key === ']' || code === 221);
                var val = el.value;
                var start = el.selectionStart;
                var end   = el.selectionEnd;
                var lines = val.split('\n');
                // find which lines are touched by the current cursor / selection
                var lineStart = val.substring(0, start).split('\n').length - 1;
                var lineEnd   = (start === end)
                    ? lineStart
                    : val.substring(0, end).split('\n').length - 1;
                var delta = 0;
                for (var i = lineStart; i <= lineEnd; i++) {
                    if (indent) {
                        lines[i] = '    ' + lines[i];
                        delta += 4;
                    } else {
                        var before = lines[i].length;
                        lines[i] = lines[i].replace(/^    /, '');
                        delta -= before - lines[i].length;
                    }
                }
                el.value = lines.join('\n');
                // keep selection in place, adjusted for added/removed spaces
                if (start === end) {
                    var newPos = Math.max(0, start + delta);
                    el.selectionStart = el.selectionEnd = newPos;
                } else {
                    el.selectionStart = Math.max(0, start + (indent ? 4 : -Math.min(4, lines[lineStart].length)));
                    el.selectionEnd   = Math.max(0, end + delta);
                }
                updateStats(tab);
                return;
            }

            if (key === 'Enter' || code === 13) {
                e.preventDefault();
                var start = el.selectionStart;
                var val = el.value;
                var lineStart = val.lastIndexOf('\n', start - 1) + 1;
                var indent = val.substring(lineStart, start).match(/^([ \t]*)/)[1];
                var ins = '\n' + indent;
                el.value = val.substring(0, start) + ins + val.substring(el.selectionEnd);
                el.selectionStart = el.selectionEnd = start + ins.length;
                updateStats(tab);
                return;
            }

            if (key === 'Escape' || code === 27) {
                closeFind(tab);
            }

            // Ctrl+/ — toggle line comment
            if ((e.ctrlKey || e.metaKey) && (key === '/' || code === 191)) {
                e.preventDefault();
                var val   = el.value;
                var start = el.selectionStart;
                var end   = el.selectionEnd;

                // Determine which lines are touched by the selection
                var lineStart = val.lastIndexOf('\n', start - 1) + 1;
                var lineEnd   = end > 0 && val[end - 1] === '\n' ? end - 1 : end;
                var lastNL    = val.lastIndexOf('\n', lineEnd - 1);
                var blockEnd  = val.indexOf('\n', lineEnd);
                if (blockEnd === -1) blockEnd = val.length;

                var before  = val.substring(0, lineStart);
                var block   = val.substring(lineStart, blockEnd);
                var after   = val.substring(blockEnd);

                var blockLines = block.split('\n');

                // Decide: if ALL non-empty lines in selection start with '#' → uncomment
                var allCommented = blockLines.every(function(l) {
                    return l.trim() === '' || /^(\s*)#\s?/.test(l);
                });

                var newLines;
                if (allCommented) {
                    // Remove leading '# ' or '#' preserving indentation
                    newLines = blockLines.map(function(l) {
                        return l.replace(/^(\s*)#\s?/, '$1');
                    });
                } else {
                    // Add '# ' at the indentation level of each line
                    newLines = blockLines.map(function(l) {
                        if (l.trim() === '') return l;
                        var indent = l.match(/^(\s*)/)[1];
                        return indent + '# ' + l.slice(indent.length);
                    });
                }

                var newBlock = newLines.join('\n');
                el.value = before + newBlock + after;

                // Restore selection covering the same lines
                var delta = newBlock.length - block.length;
                if (start === end) {
                    // cursor: keep it on the same line
                    el.selectionStart = el.selectionEnd = start + (newLines[0].length - blockLines[0].length);
                } else {
                    el.selectionStart = lineStart;
                    el.selectionEnd   = lineStart + newBlock.length;
                }

                updateStats(tab);
                _schedule(tab);
                return;
            }
        }

        // FIND / REPLACE
        // idx = -1 means "no match shown yet for current needle"

        function _syncFindBtn() {

        // Rebuild match list. Returns true if matches found.
        // If needle changed — reset idx to -1.
        function rebuildMatches(tab) {
            var needle = document.getElementById(tab + '-find-input').value;
            var st = findState[tab];
            var inp = document.getElementById(tab + '-find-input');
            inp.classList.remove('no-match');
            document.getElementById(tab + '-find-count').textContent = '';

            if (!needle) {
                st.matches = [];
                st.idx = -1;
                st.needle = '';
                return false;
            }

            // rebuild always (text in editor may have changed)
            var hay = document.getElementById(tab + '-text').value;
            var matches = [];
            var pos = 0;
            var nl = needle.length;
            while (pos <= hay.length - nl) {
                var f = hay.indexOf(needle, pos);
                if (f === -1) break;
                matches.push(f);
                pos = f + nl;
            }

            // if needle changed, reset index
            if (needle !== st.needle) {
                st.idx = -1;
                st.needle = needle;
            }

            st.matches = matches;

            if (matches.length === 0) {
                inp.classList.add('no-match');
                document.getElementById(tab + '-find-count').textContent = '0 results';
                st.idx = -1;
                return false;
            }

            // clamp idx
            if (st.idx >= matches.length) st.idx = matches.length - 1;
            return true;
        }

        function highlightMatch(tab) {
            var st = findState[tab];
            if (!st.matches.length || st.idx < 0) return;
            var el = document.getElementById(tab + '-text');
            var needle = document.getElementById(tab + '-find-input').value;
            var s = st.matches[st.idx];
            el.focus();
            el.setSelectionRange(s, s + needle.length);
            document.getElementById(tab + '-find-count').textContent =
                (st.idx + 1) + ' / ' + st.matches.length;
            // scroll to match
            var lh = parseInt(window.getComputedStyle(el).lineHeight, 10) || 22;
            var lineN = el.value.substring(0, s).split('\n').length - 1;
            var top = lineN * lh;
            var ch = el.clientHeight;
            if (top < el.scrollTop || top > el.scrollTop + ch - lh) {
                el.scrollTop = Math.max(0, top - ch / 2);
            }
        }

        function findNext(tab) {
            if (!rebuildMatches(tab)) return;
            var st = findState[tab];
            // first press: show match[0]; subsequent: advance
            if (st.idx === -1) {
                st.idx = 0;
            } else {
                st.idx = (st.idx + 1) % st.matches.length;
            }
            highlightMatch(tab);
        }

        function findPrev(tab) {
            if (!rebuildMatches(tab)) return;
            var st = findState[tab];
            if (st.idx === -1) {
                st.idx = st.matches.length - 1;
            } else {
                st.idx = (st.idx - 1 + st.matches.length) % st.matches.length;
            }
            highlightMatch(tab);
        }

        function replaceOne(tab) {
            if (!rebuildMatches(tab)) return showToast('no matches', true);
            var st = findState[tab];
            if (st.idx === -1) st.idx = 0;
            var el = document.getElementById(tab + '-text');
            var needle = document.getElementById(tab + '-find-input').value;
            var repl   = document.getElementById(tab + '-replace-input').value;
            var pos = st.matches[st.idx];
            el.value = el.value.substring(0, pos) + repl + el.value.substring(pos + needle.length);
            updateStats(tab);
            // after replace, stay at same idx (next match will shift up)
            rebuildMatches(tab);
            highlightMatch(tab);
            showToast('replaced 1');
        }

        function replaceAll(tab) {
            var el     = document.getElementById(tab + '-text');
            var needle = document.getElementById(tab + '-find-input').value;
            var repl   = document.getElementById(tab + '-replace-input').value;
            if (!needle) return showToast('nothing to find', true);
            var count = 0;
            var val = el.value;
            var result = '';
            var pos = 0;
            var nl = needle.length;
            while (true) {
                var f = val.indexOf(needle, pos);
                if (f === -1) { result += val.substring(pos); break; }
                result += val.substring(pos, f) + repl;
                pos = f + nl;
                count++;
            }
            if (!count) return showToast('no matches', true);
            el.value = result;
            updateStats(tab);
            findState[tab].idx = -1;
            rebuildMatches(tab);
            showToast('replaced ' + count);
        }

                var t2 = 'translate(-' + sx + 'px,-' + sy + 'px)';
                wso.style.webkitTransform = t2;
                wso.style.transform       = t2;
            }
        }

        // ── Word Wrap ──────────────────────────────────────────────────
        function toggleWrap(tab) {
            _wrap[tab] = !_wrap[tab];
            var btn = document.getElementById(tab + '-wrap-btn');
            var ta  = document.getElementById(tab + '-text');
            btn.classList[_wrap[tab] ? 'add' : 'remove']('is-active');
            ta.classList[_wrap[tab] ? 'add' : 'remove']('wrap-on');
            _prefsSave('wrap', tab, _wrap[tab]);
            _lhCache = {};
            _schedule(tab);
        }

        // ── Line Numbers ───────────────────────────────────────────────
        var _lhCache = {};

        function _lhPx(tab) {
            if (_lhCache[tab]) return _lhCache[tab];
            var cs = window.getComputedStyle(document.getElementById(tab + '-text'));
            var lh = parseFloat(cs.lineHeight) || (parseFloat(cs.fontSize) * 1.2);
            _lhCache[tab] = Math.max(1, lh);
            return _lhCache[tab];
        }

        function _mirrorSync(tab) {
            var ta = document.getElementById(tab + '-text');
            var m  = document.getElementById(tab + '-mirror');
            var cs = window.getComputedStyle(ta);
            var pp = ['fontFamily','fontSize','fontWeight','lineHeight','letterSpacing',
                      'paddingTop','paddingBottom','paddingLeft','paddingRight','boxSizing'];
            for (var i = 0; i < pp.length; i++) m.style[pp[i]] = cs[pp[i]];
            var tsz = cs.tabSize || cs.MozTabSize || '4';
            m.style.tabSize = tsz; m.style.MozTabSize = tsz;
            // Use the ed-body width (mirror has left:0,right:0 inside ed-body)
            // No explicit width needed — it fills ed-body naturally via right:0
            // But we set it explicitly to override any inherited value:
            m.style.width = ta.clientWidth + 'px';
            if (_wrap[tab]) {
                m.style.whiteSpace   = 'pre-wrap';
                m.style.overflowWrap = 'break-word';
                m.style.wordWrap     = 'break-word';
            } else {
                m.style.whiteSpace   = 'pre';
                m.style.overflowWrap = 'normal';
                m.style.wordWrap     = 'normal';
            }
        }

        function _visualRows(tab, lines) {
            if (!_wrap[tab]) {
                var r = new Array(lines.length);
                for (var i = 0; i < r.length; i++) r[i] = 1;
                return r;
            }
            var m = document.getElementById(tab + '-mirror');
            _mirrorSync(tab);
            var html = '';
            for (var i = 0; i < lines.length; i++) {
                var safe = lines[i].replace(/&/g, '&amp;').replace(/</g, '&lt;');
                html += '<span id="' + tab + '_m' + i + '"></span>' + (safe || '\u200B') + '\n';
            }
            m.innerHTML = html;
            var lh   = _lhPx(tab);
            var rows = new Array(lines.length);
            // Use offsetTop — reliable, not affected by page scroll or zoom transform
            // All spans are children of mirror so offsetParent is mirror itself
            for (var i = 0; i < lines.length; i++) {
                var s  = document.getElementById(tab + '_m' + i);
                var t0 = s ? s.offsetTop : i * lh;
                var t1;
                if (i + 1 < lines.length) {
                    var sn = document.getElementById(tab + '_m' + (i + 1));
                    t1 = sn ? sn.offsetTop : t0 + lh;
                } else {
                    t1 = m.scrollHeight;
                }
                rows[i] = Math.max(1, Math.round((t1 - t0) / lh));
            }
            m.innerHTML = '';
            return rows;
        }

        function _gutterUpdate(tab) {
            if (!_lnum[tab]) return;
            var ta    = document.getElementById(tab + '-text');
            var gi    = document.getElementById(tab + '-gi');
            var lines = ta.value.split('\n');
            var rows  = _visualRows(tab, lines);
            var out   = [];
            for (var i = 0; i < lines.length; i++) {
                out.push(i + 1);
                for (var r = 1; r < rows[i]; r++) out.push('');
            }
            gi.textContent = out.join('\n');
        }

        function toggleLnum(tab) {
            _lnum[tab] = !_lnum[tab];
            document.getElementById(tab + '-lnum-btn').classList[_lnum[tab] ? 'add' : 'remove']('is-active');
            document.getElementById(tab + '-gutter').classList[_lnum[tab] ? 'add' : 'remove']('on');
            _prefsSave('lnum', tab, _lnum[tab]);
            _lhCache = {};
            _schedule(tab);
        }

        // ── Whitespace Overlay ─────────────────────────────────────────
        function _wsoStyles(tab) {
            var ta  = document.getElementById(tab + '-text');
            var wso = document.getElementById(tab + '-wso');
            var cs  = window.getComputedStyle(ta);
            var pp  = ['fontFamily','fontSize','fontWeight','lineHeight','letterSpacing','boxSizing'];
            for (var i = 0; i < pp.length; i++) wso.style[pp[i]] = cs[pp[i]];
            wso.style.padding = cs.padding;
            var tsz = cs.tabSize || cs.MozTabSize || '4';
            wso.style.tabSize = tsz; wso.style.MozTabSize = tsz;
            // Must cover full scrollable content in both axes
            wso.style.width  = ta.scrollWidth  + 'px';
            wso.style.height = ta.scrollHeight + 'px';
            var t = 'translate(-' + ta.scrollLeft + 'px,-' + ta.scrollTop + 'px)';
            wso.style.webkitTransform = t;
            wso.style.transform       = t;
            if (_wrap[tab]) {
                wso.style.whiteSpace   = 'pre-wrap';
                wso.style.overflowWrap = 'break-word';
                wso.style.wordWrap     = 'break-word';
            } else {
                wso.style.whiteSpace   = 'pre';
                wso.style.overflowWrap = 'normal';
                wso.style.wordWrap     = 'normal';
            }
        }

        function _esc(s) {
            var o = '', c;
            for (var i = 0; i < s.length; i++) {
                c = s[i];
                if      (c === '&') o += '&amp;';
                else if (c === '<') o += '&lt;';
                else if (c === '>') o += '&gt;';
                else                o += c;
            }
            return o;
        }

        function _wsoUpdate(tab) {
            if (!_ws[tab]) return;
            var ta   = document.getElementById(tab + '-text');
            var wso  = document.getElementById(tab + '-wso');
            _wsoStyles(tab);
            var val   = ta.value;
            var parts = [];
            var buf   = '';
            var SP    = '\u00B7'; // middle dot for space
            var TAB   = '\u2192'; // arrow for tab
            var CR    = '\u240D'; // symbol for CR
            var LF    = '\u21B5'; // symbol for LF
            for (var i = 0; i < val.length; i++) {
                var c = val[i];
                if (c === ' ' || c === '\t' || c === '\r' || c === '\n') {
                    if (buf) { parts.push('<span style="color:transparent">' + _esc(buf) + '</span>'); buf = ''; }
                    if      (c === ' ')  parts.push('<span class="ws-sp">'  + SP  + '</span>');
                    else if (c === '\t') parts.push('<span class="ws-tab">' + TAB + '</span><span style="color:transparent">   </span>');
                    else if (c === '\r') parts.push('<span class="ws-cr">'  + CR  + '</span>');
                    else                 parts.push('<span class="ws-lf">'  + LF  + '</span>\n');
                } else {
                    buf += c;
                }
            }
            if (buf) parts.push('<span style="color:transparent">' + _esc(buf) + '</span>');
            wso.innerHTML = parts.join('');
        }

        function toggleWs(tab) {
            _ws[tab] = !_ws[tab];
            document.getElementById(tab + '-ws-btn').classList[_ws[tab] ? 'add' : 'remove']('is-active');
            document.getElementById(tab + '-wso').classList[_ws[tab] ? 'add' : 'remove']('on');
            _prefsSave('ws', tab, _ws[tab]);
            if (_ws[tab]) _schedule(tab);
        }

        // Resize — invalidate line height cache
        var _rzT = null;
        window.addEventListener('resize', function() {
            clearTimeout(_rzT);
            _rzT = setTimeout(function() {
                _lhCache = {};
                _schedule('ansible');
                _schedule('helm');
            }, 120);
        });

        // Restore saved prefs (wrap first — affects layout)
        (function() {
            var p = _prefsGet();
            var tabs = ['ansible', 'helm'];
            for (var i = 0; i < tabs.length; i++) {
                var t = tabs[i];
                if (p.wrap && p.wrap[t]) toggleWrap(t);
                if (p.lnum && p.lnum[t]) toggleLnum(t);
                if (p.ws   && p.ws[t])   toggleWs(t);
            }
        })();

    </script>
</body>
</html>
